# Reverse proxy de Snippet Searcher.
# Recibe todo en los puertos 80 y 443 y le pasa cada pedido al servicio que
# corresponde según la ruta. Es el único servicio del stack con puertos públicos.
#
# Es una plantilla: al arrancar, nginx reemplaza ${DOMINIO} por el dominio del
# ambiente (variable DOMINIO del stack). Las variables propias de nginx, como
# $host, no se tocan.
#
# Entra al contenedor como Swarm config (ver docker-stack.yml). Si se edita este
# archivo, hay que subir la versión de su config (_v2 → _v3): si no, la VM sigue
# usando la versión anterior.

# Puerto 80: solo el desafío de Let's Encrypt y la redirección a HTTPS.
server {
    listen 80;
    server_name _;

    # Let's Encrypt pide acá un archivo que dejó certbot, para comprobar que
    # el dominio es nuestro.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMINIO}$request_uri;
    }
}

# Puerto 443: HTTPS. El cifrado termina acá; a los servicios se les habla con
# HTTP, dentro de la red de Docker.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # El certificado que eligió certificado.sh: el de Let's Encrypt o, mientras
    # no exista, el provisorio.
    ssl_certificate     /etc/nginx/certificado/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificado/privkey.pem;

    # HSTS: el navegador usa siempre HTTPS con este dominio, durante un año.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Tamaño máximo de un pedido. nginx trae 1 MB por defecto; se sube para
    # poder crear snippets desde un archivo (US-1).
    client_max_body_size 5m;

    # Le dicen al servicio de dónde vino el pedido: la dirección que pidió el
    # navegador, la IP del usuario y si entró por HTTP o HTTPS.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Espera máxima para conectarse a un servicio. nginx trae 60 s; dentro de
    # la red de Docker la conexión tarda milisegundos, así que si un servicio
    # está caído el usuario ve el error enseguida. No limita lo que tarda el
    # servicio en responder.
    proxy_connect_timeout 5s;

    # Si un servicio está caído (502) o no responde a tiempo (504), se muestra
    # una página propia en lugar de la de nginx.
    error_page 502 504 /errores/no-disponible.html;
    location = /errores/no-disponible.html {
        root /usr/share/nginx/html;
        # Solo la usa error_page: no se puede pedir directo.
        internal;
    }

    # Las rutas de la API pierden el /api al pasar: los servicios no conocen
    # ese prefijo. La barra final de proxy_pass es la que lo saca.
    #   /api/permissions/snippets → permission-service /permissions/snippets
    location /api/permissions/ {
        proxy_pass http://permission-service:8080/permissions/;
    }

    #   /api/snippets → snippet-service /snippets (también /api/rules y /api/languages)
    location /api/ {
        proxy_pass http://snippet-service:8080/;
    }

    # Todo lo demás es la UI web.
    location / {
        proxy_pass http://ui:80;
    }
}
