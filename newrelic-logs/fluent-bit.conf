# fluent-bit (servicio logs del stack): manda a New Relic los logs de los
# contenedores que no tienen agente propio (proxy, certbot, ui, Postgres,
# Redis, Azurite). Los de los servicios Java (Snippet, Permission, PrintScript
# y Asset Service) no: los manda su agente, con más contexto (requestId,
# usuario y trace.id). Ver New Relic en el README.
[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

# Los logs que Docker guarda en la VM, en JSON. Cada línea trae el servicio de
# Swarm del que sale (el label que pide x-logging en docker-stack.yml).
[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*-json.log
    Parser           docker
    Tag              docker.*
    DB               /fluent-bit/db/docker.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 10

[FILTER]
    Name    grep
    Match   docker.*
    Exclude $attrs['com.docker.swarm.service.name'] ^snippet-searcher_(snippet-service|permission-service|printscript-service|asset-service|logs)$

# El servicio de cada línea, con un nombre corto, y el ambiente.
[FILTER]
    Name          nest
    Match         docker.*
    Operation     lift
    Nested_under  attrs

[FILTER]
    Name    modify
    Match   docker.*
    Rename  com.docker.swarm.service.name service
    Rename  log message
    Add     environment ${ENVIRONMENT}
    Add     logtype docker

[OUTPUT]
    Name        newrelic
    Match       docker.*
    licenseKey  ${LICENSE_KEY}
