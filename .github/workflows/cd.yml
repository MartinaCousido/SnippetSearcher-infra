# Despliega todo el stack en la VM del ambiente en cada push a dev o main.
#   push a dev  → Environment dev  → VM de dev
#   push a main → Environment prod → VM de prod
#
# Secrets de cada Environment:
#   VM_HOST               IP pública de la VM.
#   VM_USER               Usuario de la VM (azureuser).
#   VM_SSH_KEY            Contenido de la clave .pem de la VM.
#   SNIPPETS_DB_PASSWORD  Contraseña de la base de Snippet Service.
#   PERMISOS_DB_PASSWORD  Contraseña de la base de Permission Service.
name: CD

on:
  push:
    branches: [dev, main]

# Un deploy por ambiente a la vez. No se cancela uno a mitad de camino.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  desplegar-stack:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      TAG: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      # Origins que aceptan Snippet Service y Permission Service (ver CORS en
      # el README de SnippetSearcher). No es secreto: queda versionado acá.
      CORS_ALLOWED_ORIGINS: ${{ github.ref_name == 'main' && 'https://snippetsearcher-prod.duckdns.org' || 'https://snippetsearcher-dev.duckdns.org,http://localhost:5173' }}
      SNIPPETS_DB_PASSWORD: ${{ secrets.SNIPPETS_DB_PASSWORD }}
      PERMISOS_DB_PASSWORD: ${{ secrets.PERMISOS_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar el stack
        run: docker stack config -c docker-stack.yml > /dev/null

      - name: Preparar la conexión SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm.pem
          chmod 600 ~/.ssh/vm.pem
          ssh-keyscan -T 15 -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copiar el stack y la configuración del proxy a la VM
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        # Se borra nginx/ antes de copiarla, para que no queden archivos viejos.
        run: |
          ssh -i ~/.ssh/vm.pem "$VM" 'mkdir -p ~/snippet-searcher && rm -rf ~/snippet-searcher/nginx'
          scp -i ~/.ssh/vm.pem docker-stack.yml "$VM:~/snippet-searcher/docker-stack.yml"
          scp -r -i ~/.ssh/vm.pem nginx "$VM:~/snippet-searcher/nginx"

      - name: Liberar el puerto 80 de snippet-service
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        # Hasta #23, snippet-service publicaba el 80. Ahora es del proxy, pero
        # docker stack deploy puede crear el proxy antes de sacarle el puerto a
        # snippet-service, y falla. Por eso se le saca acá, antes del deploy.
        # Si snippet-service ya no publica el 80, no hace nada.
        # --publish-rm busca el puerto por el del contenedor (target=8080), no
        # por el de la VM: con --publish-rm 80 no saca nada. Si después del
        # update el 80 sigue publicado, el paso falla.
        run: |
          ssh -i ~/.ssh/vm.pem "$VM" '
            set -e
            puertos() {
              docker service inspect snippet-searcher_snippet-service \
                --format "{{range .Endpoint.Spec.Ports}}{{.PublishedPort}} {{end}}" 2>/dev/null || true
            }
            if puertos | grep -qw 80; then
              docker service update --publish-rm published=80,target=8080 snippet-searcher_snippet-service
              if puertos | grep -qw 80; then
                echo "snippet-service sigue publicando el puerto 80"
                exit 1
              fi
            fi
          '

      - name: Desplegar el stack
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        # Las variables viajan por la entrada estándar, no en la línea de
        # comandos: así las contraseñas no quedan en el historial de la VM.
        # --prune borra los servicios que ya no están en el stack.
        run: |
          printf 'TAG=%s\nSNIPPETS_DB_PASSWORD=%s\nPERMISOS_DB_PASSWORD=%s\nCORS_ALLOWED_ORIGINS=%s\n' \
            "$TAG" "$SNIPPETS_DB_PASSWORD" "$PERMISOS_DB_PASSWORD" "$CORS_ALLOWED_ORIGINS" |
          ssh -i ~/.ssh/vm.pem "$VM" '
            set -e
            set -a; . /dev/stdin; set +a
            cd ~/snippet-searcher
            docker stack deploy -c docker-stack.yml --prune --detach=true snippet-searcher
          '

      - name: Esperar a que los servicios estén arriba
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        # Espera hasta 5 minutos a que cada servicio tenga sus réplicas
        # corriendo (1/1). Si no llega, el workflow falla.
        run: |
          ssh -i ~/.ssh/vm.pem "$VM" '
            for i in $(seq 1 30); do
              pendientes=$(docker service ls --filter label=com.docker.stack.namespace=snippet-searcher \
                --format "{{.Replicas}}" | awk -F/ "\$1 != \$2" | wc -l)
              if [ "$pendientes" -eq 0 ]; then
                docker service ls --filter label=com.docker.stack.namespace=snippet-searcher
                exit 0
              fi
              sleep 10
            done
            echo "Hay servicios que no arrancaron:"
            docker service ls --filter label=com.docker.stack.namespace=snippet-searcher
            docker stack ps snippet-searcher --no-trunc | head -20
            exit 1
          '
